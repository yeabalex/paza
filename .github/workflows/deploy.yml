name: CI/CD Pipeline - Turbo, Docker Images & Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # 1. CI Stage: Turborepo lint and build verification
  ci:
    name: CI - Lint & Build (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Turbo Lint
        run: npx turbo lint

      - name: Run Turbo Build
        run: npx turbo build

  # 2. Build & Push Docker Images to GitHub Container Registry (GHCR)
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./app/backend
            dockerfile: ./app/backend/Dockerfile
            image: ghcr.io/${{ github.repository }}-backend
          - service: frontend
            context: ./app/frontend
            dockerfile: ./app/frontend/Dockerfile
            image: ghcr.io/${{ github.repository }}-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. CD Stage: Deploy Application Containers to EC2 Server via SSH
  deploy:
    name: Deploy Application Containers
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # Write .env on the runner (secrets masked in runner logs)
      - name: Write backend .env file on runner
        run: |
          cat > .env << 'ENVEOF'
          ENVIRONMENT="${{ secrets.ENVIRONMENT }}"
          DEBUG="${{ secrets.DEBUG }}"
          WEB_APP_URL="${{ secrets.WEB_APP_URL }}"

          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          REDIS_URL="${{ secrets.REDIS_URL }}"

          VITE_CLERK_PUBLISHABLE_KEY="${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}"
          CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}"

          PIPELINE_API_KEY="${{ secrets.PIPELINE_API_KEY }}"
          N8N_WEBHOOK_URL="${{ secrets.N8N_WEBHOOK_URL }}"
          N8N_API_KEY="${{ secrets.N8N_API_KEY }}"
          TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID="${{ secrets.TELEGRAM_CHAT_ID }}"

          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"

          AWS_REGION="${{ secrets.AWS_REGION }}"
          S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}"

          INSTAGRAM_USERNAME="${{ secrets.INSTAGRAM_USERNAME }}"
          INSTAGRAM_SESSION_ID="${{ secrets.INSTAGRAM_SESSION_ID }}"
          TIKTOK_SESSION_ID="${{ secrets.TIKTOK_SESSION_ID }}"
          ENVEOF
          chmod 600 .env

      # Set up SSH key
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Copy .env to server
      - name: Copy .env to server via SCP
        run: |
          APP_DIR="/home/${{ secrets.SSH_USER }}/app"
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p $APP_DIR"
          scp -i ~/.ssh/deploy_key .env ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:$APP_DIR/.env
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "chmod 600 $APP_DIR/.env"

      # Restart application containers
      - name: Deploy and restart services
        env:
          BACKEND_IMAGE_RAW: ghcr.io/${{ github.repository }}-backend:latest
          FRONTEND_IMAGE_RAW: ghcr.io/${{ github.repository }}-frontend:latest
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          APP_DIR="/home/${SSH_USER}/app"
          BACKEND_IMAGE=$(echo "${BACKEND_IMAGE_RAW}" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMAGE=$(echo "${FRONTEND_IMAGE_RAW}" | tr '[:upper:]' '[:lower:]')

          ssh -i ~/.ssh/deploy_key ${SSH_USER}@${SERVER_IP} \
            APP_DIR="$APP_DIR" BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" GITHUB_ACTOR="$GITHUB_ACTOR" GITHUB_TOKEN="$GITHUB_TOKEN" SERVER_IP="$SERVER_IP" \
            'bash -s' << 'SSHEOF'
            set -e
            cd "$APP_DIR"

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Orchestrate separate FE and BE containers
            cat > docker-compose.yml << COMPOSEEOF
            services:
              backend:
                image: ${BACKEND_IMAGE}
                container_name: paza_backend
                restart: always
                env_file:
                  - .env
                ports:
                  - "8000:8000"
                volumes:
                  - backend_static:/app/static

              frontend:
                image: ${FRONTEND_IMAGE}
                container_name: paza_frontend
                restart: always
                ports:
                  - "3000:80"

            volumes:
              backend_static:
            COMPOSEEOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af

            # Configure Caddy for paza.yab.et (frontend + forwarded /api & /static to backend)
            sudo tee /etc/caddy/Caddyfile > /dev/null << CADDYEOF
            paza.yab.et, ${SERVER_IP}.nip.io {
                respond /.env* "Access Denied" 403
                respond /.git* "Access Denied" 403

                handle /api/* {
                    reverse_proxy localhost:8000
                }

                handle /static/* {
                    reverse_proxy localhost:8000
                }

                handle {
                    reverse_proxy localhost:3000
                }
            }
            CADDYEOF
            sudo caddy validate --config /etc/caddy/Caddyfile
            sudo systemctl reload caddy || sudo systemctl restart caddy
          SSHEOF

      # Clean up SSH key from runner
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key .env
