name: CI/CD Pipeline - Turbo, Docker Images & Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # 1. CI Stage: Turborepo lint and build verification
  ci:
    name: CI - Lint & Build (Turborepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Turbo Lint
        run: npx turbo lint

      - name: Run Turbo Build
        run: npx turbo build

  # 2. Build & Push Docker Images to GitHub Container Registry (GHCR)
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./app/backend
            dockerfile: ./app/backend/Dockerfile
            image: ghcr.io/${{ github.repository }}-backend
          - service: frontend
            context: ./app/frontend
            dockerfile: ./app/frontend/Dockerfile
            image: ghcr.io/${{ github.repository }}-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. CD Stage: Deploy Application Containers to EC2 Server via SSH
  deploy:
    name: Deploy Application Containers
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # Write .env on the runner (secrets masked in runner logs)
      - name: Write backend .env file on runner
        run: |
          cat > .env << 'ENVEOF'
          PROJECT_NAME="${{ secrets.PROJECT_NAME }}"
          API_V1_STR="${{ secrets.API_V1_STR }}"
          ENVIRONMENT="${{ secrets.ENVIRONMENT }}"
          DEBUG="${{ secrets.DEBUG }}"
          PORT="${{ secrets.PORT }}"
          HOST="${{ secrets.HOST }}"

          POSTGRES_SERVER="${{ secrets.POSTGRES_SERVER }}"
          POSTGRES_PORT="${{ secrets.POSTGRES_PORT }}"
          POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          DATABASE_URL="${{ secrets.DATABASE_URL }}"

          REDIS_HOST="${{ secrets.REDIS_HOST }}"
          REDIS_PORT="${{ secrets.REDIS_PORT }}"
          REDIS_URL="${{ secrets.REDIS_URL }}"

          GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
          DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"

          JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
          JWT_ALGORITHM="${{ secrets.JWT_ALGORITHM }}"
          JWT_ACCESS_TOKEN_EXPIRE_DAYS="${{ secrets.JWT_ACCESS_TOKEN_EXPIRE_DAYS }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          PIPELINE_API_KEY="${{ secrets.PIPELINE_API_KEY }}"

          WEB_APP_URL="${{ secrets.WEB_APP_URL }}"

          INSTAGRAM_USERNAME="${{ secrets.INSTAGRAM_USERNAME }}"
          INSTAGRAM_PASSWORD="${{ secrets.INSTAGRAM_PASSWORD }}"
          INSTAGRAM_SESSION_ID="${{ secrets.INSTAGRAM_SESSION_ID }}"
          TIKTOK_SESSION_ID="${{ secrets.TIKTOK_SESSION_ID }}"

          CLOUDINARY_CLOUD_NAME="${{ secrets.CLOUDINARY_CLOUD_NAME }}"
          CLOUDINARY_API_KEY="${{ secrets.CLOUDINARY_API_KEY }}"
          CLOUDINARY_API_SECRET="${{ secrets.CLOUDINARY_API_SECRET }}"
          CLOUDINARY_URL="${{ secrets.CLOUDINARY_URL }}"

          R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}"
          R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}"
          R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}"
          R2_BUCKET_NAME="${{ secrets.R2_BUCKET_NAME }}"
          R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL }}"
          ENVEOF
          chmod 600 .env

      # Set up SSH key
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # Copy .env to server
      - name: Copy .env to server via SCP
        run: |
          APP_DIR="/home/${{ secrets.SSH_USER }}/app"
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p $APP_DIR"
          scp -i ~/.ssh/deploy_key .env ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:$APP_DIR/.env
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "chmod 600 $APP_DIR/.env"

      # Restart application containers
      - name: Deploy and restart services
        env:
          BACKEND_IMAGE_RAW: ghcr.io/${{ github.repository }}-backend:latest
          FRONTEND_IMAGE_RAW: ghcr.io/${{ github.repository }}-frontend:latest
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          APP_DIR="/home/${SSH_USER}/app"
          BACKEND_IMAGE=$(echo "${BACKEND_IMAGE_RAW}" | tr '[:upper:]' '[:lower:]')
          FRONTEND_IMAGE=$(echo "${FRONTEND_IMAGE_RAW}" | tr '[:upper:]' '[:lower:]')

          ssh -i ~/.ssh/deploy_key ${SSH_USER}@${SERVER_IP} \
            APP_DIR="$APP_DIR" BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_IMAGE="$FRONTEND_IMAGE" GITHUB_ACTOR="$GITHUB_ACTOR" \
            'bash -s' << 'SSHEOF'
            set -e
            cd "$APP_DIR"

            # Login to GHCR
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Orchestrate separate FE and BE containers
            cat > docker-compose.yml << COMPOSEEOF
            services:
              backend:
                image: ${BACKEND_IMAGE}
                container_name: paza_backend
                restart: always
                env_file:
                  - .env
                ports:
                  - "8000:8000"
                volumes:
                  - backend_static:/app/static

              frontend:
                image: ${FRONTEND_IMAGE}
                container_name: paza_frontend
                restart: always
                ports:
                  - "3000:80"

            volumes:
              backend_static:
            COMPOSEEOF

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af
          SSHEOF

      # Clean up SSH key from runner
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key .env
