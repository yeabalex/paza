services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paza_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - backend_static:/app/static

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paza_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  backend_static:
